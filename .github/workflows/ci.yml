name: ci

on:
  push:
  pull_request:

jobs:
  solver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gawk
      - name: Build Basilisk from the archived tarball
        run: make basilisk
      - name: Run one coarse ligament
        run: make smoke

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf
